[workspace]
resolver = "3"
members = ["crates/core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
engine = { path = "../rust-ml/gomoku/crates/engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["serde", "serde-human-readable", "macros"] }
toml = "1"
thiserror = "2"
proptest = "1"
tempfile = "3"
