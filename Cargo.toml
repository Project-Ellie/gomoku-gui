[workspace]
resolver = "3"
members = ["crates/core", "crates/gui", "tools/generate-glyph-atlas"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
# One upstream revision for the rules and future AI crates; no sibling checkout.
# Only engine is consumed in M0. See docs/plans/2026-11-07-rust-ml-integration.md.
engine = { git = "https://github.com/Project-Ellie/rust-ml", rev = "c7ea3b5110157938427228e2cc2e627fa1c6b5bd" }
mcts = { git = "https://github.com/Project-Ellie/rust-ml", rev = "c7ea3b5110157938427228e2cc2e627fa1c6b5bd" }
player = { git = "https://github.com/Project-Ellie/rust-ml", rev = "c7ea3b5110157938427228e2cc2e627fa1c6b5bd" }
baseline = { git = "https://github.com/Project-Ellie/rust-ml", rev = "c7ea3b5110157938427228e2cc2e627fa1c6b5bd" }
gomoku-core = { path = "crates/core" }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["serde", "serde-human-readable", "macros"] }
toml = "1"
thiserror = "2"
proptest = "1"
tempfile = "3"
