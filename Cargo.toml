[workspace]
resolver = "3"
members = ["crates/core", "crates/engine", "crates/gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
# The rules engine is a copy of the one in the rust-ml repository, so that
# this repository builds on its own. See docs/decisions/ADR-008.
engine = { path = "crates/engine" }
gomoku-core = { path = "crates/core" }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["serde", "serde-human-readable", "macros"] }
toml = "1"
thiserror = "2"
proptest = "1"
criterion = "0.5"
tempfile = "3"
